<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Złoty gradient obramowania i blasku -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Poświata za Smoczym Okiem -->
    <radialGradient id="eyeAura" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#b45309" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Płonąca złoto-bursztynowa tęczówka Smoczego Oka -->
    <radialGradient id="dragonIris" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="28%" stop-color="#fde047"/>
      <stop offset="62%" stop-color="#f59e0b"/>
      <stop offset="88%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Złoty cień pod inicjałami AW -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#f59e0b" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#d97706" flood-opacity="0.55"/>
    </filter>

    <!-- Poświata oka -->
    <filter id="eyeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Maska kształtu otwartego oka -->
    <clipPath id="eyeOpeningClip">
      <path d="M 88 188 Q 256 78 424 188 Q 256 298 88 188 Z"/>
    </clipPath>
  </defs>

  <!-- Smoliście czarny zaokrąglony kwadrat ze złotą obwódką -->
  <rect x="14" y="14" width="484" height="484" rx="102" ry="102" fill="#000000" stroke="url(#goldBorder)" stroke-width="10"/>
  <rect x="28" y="28" width="456" height="456" rx="90" ry="90" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Poświata w tle -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#eyeAura)"/>

  <!-- Górna część: Otwarte płonące złoto-bursztynowe Smocze Oko -->
  <g filter="url(#eyeGlow)">
    <!-- Zarys gadziej powieki -->
    <path d="M 76 188 Q 256 64 436 188 Q 256 312 76 188 Z" fill="#120904" stroke="url(#goldBorder)" stroke-width="5"/>

    <!-- Wnętrze otwartego oka (tęczówka + pionowa czarna źrenica) -->
    <g clip-path="url(#eyeOpeningClip)">
      <rect x="80" y="78" width="352" height="220" fill="#1c0a02"/>
      <circle cx="256" cy="188" r="96" fill="url(#dragonIris)"/>

      <!-- Promienie ognia w tęczówce -->
      <g stroke="#7c2d12" stroke-opacity="0.45" stroke-width="3">
        <line x1="256" y1="188" x2="180" y2="128"/>
        <line x1="256" y1="188" x2="210" y2="104"/>
        <line x1="256" y1="188" x2="302" y2="104"/>
        <line x1="256" y1="188" x2="332" y2="128"/>
        <line x1="256" y1="188" x2="180" y2="248"/>
        <line x1="256" y1="188" x2="210" y2="272"/>
        <line x1="256" y1="188" x2="302" y2="272"/>
        <line x1="256" y1="188" x2="332" y2="248"/>
      </g>

      <!-- Złota obwódka źrenicy -->
      <path d="M 256 104 Q 282 188 256 272 Q 230 188 256 104 Z" fill="none" stroke="#fef08a" stroke-width="4" stroke-opacity="0.85"/>

      <!-- Pionowa czarna źrenica -->
      <path d="M 256 106 Q 279 188 256 270 Q 233 188 256 106 Z" fill="#030202"/>

      <!-- Drobny refleks światła na oku -->
      <ellipse cx="222" cy="150" rx="14" ry="8" transform="rotate(-24 222 150)" fill="#fffbeb" fill-opacity="0.72"/>
    </g>

    <!-- Złote zaostrzone kąciki oka -->
    <path d="M 76 188 Q 256 76 436 188" fill="none" stroke="url(#goldBorder)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 76 188 Q 256 300 436 188" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Subtelny złoty separator -->
  <line x1="126" y1="304" x2="386" y2="304" stroke="url(#goldBorder)" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Dolna część: Wyraźne, pogrubione białe inicjały AW ze złotym cieniem -->
  <text
    x="256"
    y="424"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="118"
    font-weight="700"
    letter-spacing="10"
    fill="#ffffff"
    stroke="#fde68a"
    stroke-width="1.5"
    filter="url(#goldShadow)"
  >AW</text>
</svg>
